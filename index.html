<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shake-n-Wake Vibrationswecker – Tasten erklärt</title>
<meta name="description" content="Interaktive Kurzanleitung für den kleinen Shake-n-Wake Vibrationswecker mit AAA-Batterie: Uhrzeit, Weckzeit, Stoppuhr, Stundensignal, Licht.">
<meta name="theme-color" content="#ECEAF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1926" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
<link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script>
/* Pick the language before first paint: saved choice, else browser language. */
(function(){var l="de";try{var s=localStorage.getItem("snw-lang");if(s==="de"||s==="en")l=s;else if(!/^de\b/i.test(navigator.language||"de"))l="en"}catch(e){}
var r=document.documentElement;r.lang=l;if(l!=="de")r.classList.add("pre-render")})();
</script>
<script src="js/app.js" defer></script>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 id="h1">Shake-n-Wake: welche Taste macht was?</h1>
    <p class="lede"><span class="lede-intro" id="lede1">Für den kleinen Vibrationswecker mit einer AAA-Batterie.</span> <span id="lede2">Funktion auswählen – die Tasten zum Drücken leuchten orange, die Zahlen zeigen die Reihenfolge.</span></p>
  </div>
  <div class="lang" role="group" aria-label="Sprache / Language">
    <button type="button" data-lang="de" lang="de" aria-label="Deutsch" aria-pressed="true">DE</button>
    <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
  </div>
</header>

<noscript><p class="noscript">Diese Seite benötigt JavaScript. / This page needs JavaScript.</p></noscript>

<main class="grid">

  <div class="device">
    <svg viewBox="0 44 380 290" role="img" aria-labelledby="svgt">
      <title id="svgt">Wecker von oben mit markierten Tasten</title>
      <rect id="k-set" class="key" x="58" y="78" width="14" height="46" rx="4"/>
      <rect id="k-light" class="key" x="58" y="196" width="14" height="46" rx="4"/>
      <rect id="k-adj" class="key" x="308" y="78" width="14" height="46" rx="4"/>
      <rect id="k-mode" class="key" x="308" y="196" width="14" height="46" rx="4"/>
      <rect id="k-slide" class="key" x="155" y="282" width="70" height="16" rx="4"/>
      <rect x="68" y="56" width="244" height="232" rx="22" fill="var(--plastic)" stroke="var(--plastic-edge)" stroke-width="2"/>

      <text id="lcd-main" class="lcdtxt" x="190" y="179" text-anchor="middle" font-size="38"></text>
      <text id="lcd-sub" class="lcdtxt" x="190" y="198" text-anchor="middle" font-size="13"></text>

      <text id="l-slide" class="klabel" x="180" y="274" text-anchor="end"></text>
      <text id="l-slide2" class="klabel" x="200" y="274"></text>

      <g id="b-light" class="badge" data-mid="219"><rect x="2" y="204" width="52" height="30" rx="15" fill="var(--orange)"/><text x="28" text-anchor="middle" font-size="16" font-weight="700" fill="var(--orange-ink)"></text><text x="28" text-anchor="middle" font-size="12" font-weight="700" fill="var(--orange-ink)"></text></g>
      <g id="b-adj" class="badge" data-mid="101"><rect x="326" y="86" width="52" height="30" rx="15" fill="var(--orange)"/><text x="352" text-anchor="middle" font-size="16" font-weight="700" fill="var(--orange-ink)"></text><text x="352" text-anchor="middle" font-size="12" font-weight="700" fill="var(--orange-ink)"></text></g>

      <g id="b-slide" class="badge"><rect x="232" y="300" width="60" height="28" rx="14" fill="var(--orange)"/><path d="M250 314l7-5v10zM274 314l-7-5v10z" fill="var(--orange-ink)"/></g>
    </svg>
    <p class="legend" id="legend">Zwei Namen an einer Taste = eine Taste. Fett ist der Name, den der Schritt meint.</p>
  </div>

  <div>
    <nav id="nav" aria-label="Funktionen"></nav>
    <section class="panel" aria-labelledby="ttl">
      <h2 id="ttl"></h2>
      <ol id="steps"></ol>
      <p class="note" id="note"></p>
    </section>
    <div class="tip"><p id="tip"></p></div>
  </div>
</main>
<p class="sr-only" id="announce" aria-live="polite"></p>

<footer><p id="foot"></p></footer>
</div>

</body>
</html>
